name: Deploy indexer

on:
  push:
    branches: [main]
    paths:
      - "apps/indexer/**"
      # The backend manifest is deliberately absent, even though the image's
      # install layer reads it: --immutable resolves the whole workspace graph,
      # so the manifest is copied in but only its effect on the lockfile can
      # change what gets installed. yarn.lock below covers that, which leaves
      # edits this image cannot observe — a moved dependency line, a renamed
      # script — no longer rebuilding it.
      - "packages/**"
      - "package.json"
      - "yarn.lock"
      - ".dockerignore"
      - ".github/workflows/deploy-indexer.yml"
  workflow_dispatch:

# A newer push supersedes a deploy of this app that is still running, while the
# other app keeps deploying on its own group.
concurrency:
  group: deploy-indexer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase image names, which a repository owner may have.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rips-indexer" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/indexer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,mode=max,scope=indexer

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull indexer
            docker compose up -d indexer
            docker image prune -f

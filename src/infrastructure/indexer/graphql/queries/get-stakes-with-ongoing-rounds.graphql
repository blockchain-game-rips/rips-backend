query GetStakesWithOngoingRounds {
    stakes {
        id
        deleted
        configs(orderBy: id_DESC, limit: 1) {
            id
            currency
            ticketCap
            ticketCost
            feePercent
            durationSeconds
            prizeDistribution(orderBy: tierIndex_ASC) {
                prizeCount
                minPrize
                maxPrize
            }
        }
        rounds(where: { status_not_in: [CLAIMED, REFUNDED] }) {
            id
            stakeId
            startTime
            status
            randomA
            randomB
            config {
                id
                currency
                ticketCap
                ticketCost
                feePercent
                durationSeconds
                prizeDistribution(orderBy: tierIndex_ASC) {
                    prizeCount
                    minPrize
                    maxPrize
                }
            }
            ticketPurchases {
                user
                ticketCount
                startTicketIndex
            }
            prizesClaimed {
                user
                amount
            }
            refunds {
                user
                amount
            }
        }
    }
}

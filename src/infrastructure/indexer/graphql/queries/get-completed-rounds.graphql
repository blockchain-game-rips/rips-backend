query GetCompletedRounds($limit: Int!, $cursor: String) {
    rounds(
        where: {
            status_in: [CLAIMED, REFUNDED]
            id_gt: $cursor
        }
        orderBy: id_ASC
        limit: $limit
    ) {
        id
        stakeId
        startTime
        status
        randomA
        randomB
        config {
            id
            currency
            ticketCap
            ticketCost
            feePercent
            durationSeconds
            prizeDistribution(orderBy: tierIndex_ASC) {
                prizeCount
                minPrize
                maxPrize
            }
        }
        ticketPurchases {
            user
            ticketCount
            startTicketIndex
        }
        prizesClaimed {
            user
            amount
        }
        refunds {
            user
            amount
        }
    }
}

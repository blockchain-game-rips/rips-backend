query GetRoundsByIds($ids: [String!]!) {
    rounds(
        where: {
            id_in: $ids
        }
    ) {
        id
        stakeId
        startTime
        status
        randomA
        randomB
        config {
            id
            currency
            ticketCap
            ticketCost
            feePercent
            durationSeconds
            prizeDistribution(orderBy: tierIndex_ASC) {
                prizeCount
                minPrize
                maxPrize
            }
        }
        ticketPurchases {
            user
            ticketCount
            startTicketIndex
        }
        prizesClaimed {
            user
            amount
        }
        refunds {
            user
            amount
        }
    }
}

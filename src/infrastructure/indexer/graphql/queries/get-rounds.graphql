query GetRounds {
    rounds {
        id
        stakeConfigId
        stakeConfig {
            id
            ticketCap
            ticketCost
            durationSeconds
            prizeDistribution(orderBy: tierIndex_ASC) {
                prizeCount
                minPrize
                maxPrize
            }
        }
        startTime
        ticketsSold
        status
        randomA
        randomB
        ticketPurchases {
            id
            buyer
            count
            txHash
            startTicketIndex
            time
        }
        prizesClaimed {
            id
            claimer
            amount
            txHash
            time
        }
        refunds {
            id
            user
            amount
            txHash
            time
        }
    }
}

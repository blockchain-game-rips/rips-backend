# Rip status state machine
#
# Happy path (entry cap reached):
#   FILLING --(EntriesPurchased: entriesSold === entryCap)--> SEALED
#   SEALED  --(RandomnessRequested)--> VRF_REQUESTED
#   VRF_REQUESTED --(RandomnessFulfilled)--> CLAIMING
#   CLAIMING --(PayoutsClaimed: entriesClaimed === entriesSold)--> CLAIMED
#
# Refund path (rip expired before cap):
#   FILLING --(no event: startTime + duration < now)--> REFUNDING
#   REFUNDING --(RefundIssued: entriesRefunded === entriesSold)--> REFUNDED
#
# Transition conditions per status:
#   FILLING     vrfRequestStatus = NOT_REQUESTED
#               entriesSold < entryCap
#               startTime + durationSeconds >= now
#
#   SEALED      vrfRequestStatus = NOT_REQUESTED
#               entriesSold = entryCap
#
#   VRF_REQUESTED  vrfRequestStatus = REQUESTED
#
#   CLAIMING    vrfRequestStatus = FULFILLED
#               entriesClaimed < entriesSold
#
#   CLAIMED     vrfRequestStatus = FULFILLED
#               entriesClaimed = entriesSold
#
#   REFUNDING   vrfRequestStatus = NOT_REQUESTED
#               entriesSold < entryCap
#               startTime + durationSeconds < now
#               entriesRefunded < entriesSold
#
#   REFUNDED    vrfRequestStatus = NOT_REQUESTED
#               entriesSold < entryCap
#               startTime + durationSeconds < now
#               entriesRefunded = entriesSold

enum RipStatus {
	FILLING
	SEALED
	VRF_REQUESTED
	CLAIMING
	CLAIMED
	REFUNDING
	REFUNDED
}

type Preset @entity {
	id: ID!
	deleted: Boolean!
	configs: [Config!]! @derivedFrom(field: "preset")
	rips: [Rip!]! @derivedFrom(field: "preset")
}

type Config @entity {
	id: ID!
	preset: Preset!
	entryCap: BigInt!
	currency: String!
	durationSeconds: BigInt!
	entryPrice: BigInt!
	feeBps: BigInt!
	payoutDistribution: [PayoutTier!]! @derivedFrom(field: "config")
	rips: [Rip!]! @derivedFrom(field: "config")
}

type PayoutTier @entity {
	id: ID!
	config: Config!
	tierIndex: Int!
	payoutCount: BigInt!
	minPayout: BigInt!
	maxPayout: BigInt!
}

enum VrfRequestStatus {
	NOT_REQUESTED
	REQUESTED
	FULFILLED
}

type Rip @entity {
	id: ID!
	config: Config!
	preset: Preset!
	startTime: DateTime!
	entriesSold: BigInt!
	entriesClaimed: BigInt!
	entriesRefunded: BigInt!
	status: RipStatus!
	vrfRequestStatus: VrfRequestStatus!
	randomA: BigInt
	randomB: BigInt
	vrfRequestId: BigInt
	entryPurchases: [EntryPurchase!]! @derivedFrom(field: "rip")
	payoutsClaimed: [PayoutClaim!]! @derivedFrom(field: "rip")
	refunds: [Refund!]! @derivedFrom(field: "rip")
}

type EntryPurchase @entity {
	id: ID!
	rip: Rip!
	user: String!
	entryCount: BigInt!
	startEntryIndex: BigInt!
	blockNumber: BigInt!
	time: DateTime!
	txHash: String!
}

type PayoutClaim @entity {
	id: ID!
	rip: Rip!
	user: String!
	referrer: String!
	entryCount: BigInt!
	amount: BigInt!
	blockNumber: BigInt!
	time: DateTime!
	txHash: String!
}

type Refund @entity {
	id: ID!
	rip: Rip!
	user: String!
	entryCount: BigInt!
	amount: BigInt!
	blockNumber: BigInt!
	time: DateTime!
	txHash: String!
}


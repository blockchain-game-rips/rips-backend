query GetPresetsWithOngoingRips {
    presets {
        id
        deleted
        configs(orderBy: id_DESC, limit: 1) {
            id
            currency
            entryCap
            entryCost
            feePercent
            durationSeconds
            payoutDistribution(orderBy: tierIndex_ASC) {
                payoutCount
                minPayout
                maxPayout
            }
        }
        rips(where: { status_not_in: [CLAIMED, REFUNDED] }) {
            id
            presetId
            startTime
            status
            randomA
            randomB
            config {
                id
                currency
                entryCap
                entryCost
                feePercent
                durationSeconds
                payoutDistribution(orderBy: tierIndex_ASC) {
                    payoutCount
                    minPayout
                    maxPayout
                }
            }
            entryPurchases {
                user
                entryCount
                startEntryIndex
            }
            payoutsClaimed {
                user
                amount
            }
            refunds {
                user
                amount
            }
        }
    }
}

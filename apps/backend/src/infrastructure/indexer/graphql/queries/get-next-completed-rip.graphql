query GetNextCompletedRip($afterRipId: String!) {
    rips(
        where: {
            status_in: [CLAIMED, REFUNDED]
            id_gt: $afterRipId
        }
        orderBy: id_ASC
        limit: 1
    ) {
        id
        presetId
        startTime
        status
        randomA
        randomB
        config {
            id
            currency
            entryCap
            entryPrice
            feePercent
            durationSeconds
            payoutDistribution(orderBy: tierIndex_ASC) {
                payoutCount
                minPayout
                maxPayout
            }
        }
        entryPurchases {
            user
            entryCount
            startEntryIndex
        }
        payoutsClaimed {
            user
            amount
        }
        refunds {
            user
            amount
        }
    }
}

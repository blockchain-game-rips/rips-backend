type StakeConfig @entity {
    id: ID!
    ticketCap: BigInt!
    duration: BigInt!
    ticketCost: BigInt!
    prizeDistribution: [PrizeTier!]! @derivedFrom(field: "stakeConfig")
    deleted: Boolean!
    rounds: [Round!]! @derivedFrom(field: "stakeConfig")
}

type PrizeTier @entity {
    id: ID!
    stakeConfig: StakeConfig!
    tierIndex: Int!
    prizeCount: BigInt!
    minPrize: BigInt!
    maxPrize: BigInt!
}

enum RoundStatus {
    Active
    SoldOut
    VRFRequested
    Finalized
}

type Round @entity {
    id: ID!
    stakeConfig: StakeConfig!
    startTime: BigInt!
    ticketsSold: Int!
    status: RoundStatus!
    randomA: BigInt
    randomB: BigInt
    vrfRequestId: BigInt
    ticketPurchases: [TicketPurchase!]! @derivedFrom(field: "round")
    prizesClaimed: [PrizeClaim!]! @derivedFrom(field: "round")
    refunds: [Refund!]! @derivedFrom(field: "round")
}

type TicketPurchase @entity {
    id: ID!
    round: Round!
    buyer: String!
    count: BigInt!
    blockNumber: BigInt!
    timestamp: DateTime!
    txHash: String!
}

type PrizeClaim @entity {
    id: ID!
    round: Round!
    claimer: String!
    amount: BigInt!
    blockNumber: BigInt!
    timestamp: DateTime!
    txHash: String!
}

type Refund @entity {
    id: ID!
    round: Round!
    user: String!
    amount: BigInt!
    blockNumber: BigInt!
    timestamp: DateTime!
    txHash: String!
}

type ProtocolSettings @entity {
    id: ID!
    feePercent: BigInt!
    feeRecipient: String!
    callbackGasLimit: Int!
}

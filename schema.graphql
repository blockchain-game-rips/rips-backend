type StakeConfig @entity {
    id: ID!
    ticketCap: BigInt!
    currency: String!
    durationSeconds: BigInt!
    ticketCost: BigInt!
    prizeDistribution: [PrizeTier!]! @derivedFrom(field: "stakeConfig")
    deleted: Boolean!
    rounds: [Round!]! @derivedFrom(field: "stakeConfig")
}

type PrizeTier @entity {
    id: ID!
    stakeConfig: StakeConfig!
    tierIndex: Int!
    prizeCount: BigInt!
    minPrize: BigInt!
    maxPrize: BigInt!
}

enum RoundStatus {
    Unsettled
    Sealed
    VRFRequested
    Claiming
    Claimed
    Refunded
}

type Round @entity {
    id: ID!
    stakeConfig: StakeConfig!
    startTime: DateTime!
    ticketsSold: Int!
    ticketsClaimed: Int!
    ticketsRefunded: Int!
    status: RoundStatus!
    randomA: BigInt
    randomB: BigInt
    vrfRequestId: BigInt
    ticketPurchases: [TicketPurchase!]! @derivedFrom(field: "round")
    prizesClaimed: [PrizeClaim!]! @derivedFrom(field: "round")
    refunds: [Refund!]! @derivedFrom(field: "round")
}

type TicketPurchase @entity {
    id: ID!
    round: Round!
    user: String!
    ticketCount: BigInt!
    startTicketIndex: BigInt!
    blockNumber: BigInt!
    time: DateTime!
    txHash: String!
}

type PrizeClaim @entity {
    id: ID!
    round: Round!
    user: String!
    ticketCount: BigInt! 
    amount: BigInt!
    blockNumber: BigInt!
    time: DateTime!
    txHash: String!
}

type Refund @entity {
    id: ID!
    round: Round!
    user: String!
    ticketCount: BigInt! 
    amount: BigInt!
    blockNumber: BigInt!
    time: DateTime!
    txHash: String!
}

type ProtocolFeeUpdated @entity {
    id: ID!
    feePercent: BigInt!
    blockNumber: BigInt!
    time: DateTime!
    txHash: String!
}

type FeeRecipientUpdated @entity {
    id: ID!
    feeRecipient: String!
    blockNumber: BigInt!
    time: DateTime!
    txHash: String!
}

type CallbackGasLimitUpdated @entity {
    id: ID!
    callbackGasLimit: Int!
    blockNumber: BigInt!
    time: DateTime!
    txHash: String!
}
